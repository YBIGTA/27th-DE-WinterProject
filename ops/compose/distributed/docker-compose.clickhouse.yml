version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - ../../../config/.env
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123" # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native TCP interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    entrypoint:
      - /bin/sh
      - -c
      - |
        awk -F': *' '/^[A-Z0-9_]+:/{v=$2; gsub(/^"|"$/, "", v); print $1 "=\"" v "\""}' /config/default.yaml > /tmp/clickhouse_runtime.env
        set -a
        . /tmp/clickhouse_runtime.env
        set +a
        exec /entrypoint.sh clickhouse server
    volumes:
      - ../../../infra/clickhouse/config/default.yaml:/config/default.yaml:ro
      # 데이터 영속화 (컨테이너 내려도 데이터 남음)
      - clickhouse_data:/var/lib/clickhouse

      # (선택) 설정 커스텀하고 싶을 때: configs/ 아래에 파일 두고 사용
      # - ../../../infra/clickhouse/config.d:/etc/clickhouse-server/config.d
      # - ../../../infra/clickhouse/users.d:/etc/clickhouse-server/users.d

      # schema.sql을 자동으로 초기 적용하고 싶을 때 (아래 init 서비스와 함께 사용)
      - ../../../infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD", "bash", "-lc", "wget -qO- http://localhost:${CLICKHOUSE_HTTP_PORT:-8123}/ping | grep -q Ok" ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  clickhouse_data:
