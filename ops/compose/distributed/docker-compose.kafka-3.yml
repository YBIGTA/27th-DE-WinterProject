version: "3.8"

services:
  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    env_file:
      - ../../../config/.env
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "${KAFKA_INTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${KAFKA_1_IP}:${KAFKA_CONTROLLER_PORT:-19093},2@${KAFKA_2_IP}:${KAFKA_CONTROLLER_PORT:-19093},3@${KAFKA_3_IP}:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_3_IP}:${KAFKA_EXTERNAL_PORT:-9092},INTERNAL://${KAFKA_3_IP}:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      CLUSTER_ID: "MkU3OEVCNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    entrypoint:
      - /bin/sh
      - -c
      - |
        awk -F': *' '/^[A-Z0-9_]+:/{v=$2; gsub(/^"|"$/, "", v); print $1 "=\"" v "\""}' /config/default.yaml > /tmp/kafka_runtime.env
        set -a
        . /tmp/kafka_runtime.env
        set +a
        exec /etc/confluent/docker/run

    volumes:
      - ../../../infra/kafka/config/default.yaml:/config/default.yaml:ro
      - kafka3-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

networks:
  kafka-network:
    driver: bridge
    external: true
    name: kafka-network

volumes:
  kafka3-data:
