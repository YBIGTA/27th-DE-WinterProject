version: '3.8'

services:
  ingestor-3:
    build: ../../../services/ingestor
    container_name: ingestor-3
    env_file:
      - ../../../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:${KAFKA_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_EXTERNAL_PORT:-9092},${KAFKA_3_IP}:${KAFKA_EXTERNAL_PORT:-9092}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
    volumes:
      - ../../../services/ingestor/config/default.yaml:/app/config/default.yaml:ro
    ports:
      - "${INGESTOR_3_PORT:-8080}:${INGESTOR_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
