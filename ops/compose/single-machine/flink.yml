version: "3.8"

services:
  flink-jobmanager:
    image: flink:1.17.2-scala_2.12
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    env_file:
      - ../../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 1
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - FLINK_CLICKHOUSE_HOST=clickhouse
    networks:
      - kafka-network

  flink-taskmanager:
    image: flink:1.17.2-scala_2.12
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    env_file:
      - ../../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=kafka-1:29092,kafka-2:29092,kafka-3:29092
      - FLINK_CLICKHOUSE_HOST=clickhouse
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network
