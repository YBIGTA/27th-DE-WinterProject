version: '3.8'

services:
  ingestor-1:
    build: ../../../services/ingestor
    container_name: ingestor-1
    env_file:
      - ../../../config/.env
    ports:
      - "${INGESTOR_1_PORT:-8081}:${INGESTOR_PORT:-8080}"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
    volumes:
      - ../../../services/ingestor/config/default.yaml:/app/config/default.yaml:ro
    networks:
      - kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-2:
    build: ../../../services/ingestor
    container_name: ingestor-2
    env_file:
      - ../../../config/.env
    ports:
      - "${INGESTOR_2_PORT:-8082}:${INGESTOR_PORT:-8080}"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
    volumes:
      - ../../../services/ingestor/config/default.yaml:/app/config/default.yaml:ro
    networks:
      - kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-3:
    build: ../../../services/ingestor
    container_name: ingestor-3
    env_file:
      - ../../../config/.env
    ports:
      - "${INGESTOR_3_PORT:-8083}:${INGESTOR_PORT:-8080}"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
    volumes:
      - ../../../services/ingestor/config/default.yaml:/app/config/default.yaml:ro
    networks:
      - kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Dummy service to check kafka is healthy
  kafka-healthcheck:
    image: busybox
    container_name: kafka-healthcheck
    command: ["sh", "-c", "echo 'Waiting for Kafka...' && sleep 5"]
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network
