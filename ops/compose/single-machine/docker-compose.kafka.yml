version: "3.8"

services:
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    env_file:
      - ../../../config/.env
    ports:
      - "${KAFKA_1_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:${KAFKA_1_EXTERNAL_PORT:-9092},INTERNAL://kafka-1:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ../../../infra/kafka/config/default.yaml:/config/default.yaml:ro
      - ../../../infra/kafka/entrypoint.sh:/entrypoint.sh:ro
      - kafka1-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    env_file:
      - ../../../config/.env
    ports:
      - "${KAFKA_2_EXTERNAL_PORT:-9094}:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:${KAFKA_2_EXTERNAL_PORT:-9094},INTERNAL://kafka-2:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ../../../infra/kafka/config/default.yaml:/config/default.yaml:ro
      - ../../../infra/kafka/entrypoint.sh:/entrypoint.sh:ro
      - kafka2-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    env_file:
      - ../../../config/.env
    ports:
      - "${KAFKA_3_EXTERNAL_PORT:-9096}:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://localhost:${KAFKA_3_EXTERNAL_PORT:-9096},INTERNAL://kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ../../../infra/kafka/config/default.yaml:/config/default.yaml:ro
      - ../../../infra/kafka/entrypoint.sh:/entrypoint.sh:ro
      - kafka3-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    env_file:
      - ../../../config/.env
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-network
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

networks:
  kafka-network:
    name: kafka-network
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
