apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: PDEE91DDB90597936
    access: proxy
    isDefault: true
    jsonData:
      host: ${CLICKHOUSE_IP}
      port: ${CLICKHOUSE_NATIVE_PORT}
      protocol: native
      defaultDatabase: default
    editable: true

  - name: Prometheus
    type: prometheus
    uid: PBFA97CFB590B2093
    access: proxy
    url: http://${PROMETHEUS_IP}:${PROMETHEUS_PORT}
    isDefault: false
    editable: true
