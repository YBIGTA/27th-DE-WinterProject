services:
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_1_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_1_IP:-localhost}:${KAFKA_1_EXTERNAL_PORT:-9092},INTERNAL://kafka-1:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-1 -Dcom.sun.management.jmxremote.rmi.port=9999"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_2_EXTERNAL_PORT:-9094}:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_2_IP:-localhost}:${KAFKA_2_EXTERNAL_PORT:-9094},INTERNAL://kafka-2:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-2 -Dcom.sun.management.jmxremote.rmi.port=9999"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_3_EXTERNAL_PORT:-9096}:9092"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:${KAFKA_CONTROLLER_PORT:-19093},2@kafka-2:${KAFKA_CONTROLLER_PORT:-19093},3@kafka-3:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT:-29092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-19093}"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_3_IP:-localhost}:${KAFKA_3_EXTERNAL_PORT:-9096},INTERNAL://kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka-3
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka-3 -Dcom.sun.management.jmxremote.rmi.port=9999"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - kafka-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  jmx-exporter-kafka-1:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-kafka-1
    environment:
      JMX_HOSTPORT: "kafka-1:9999"
    volumes:
      - ./jmx-exporter/kafka-kraft-3_0_0-rules.yml:/etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      printf 'hostPort: %s\n\n' "$$JMX_HOSTPORT" > /tmp/kafka-jmx.yml &&
      cat /etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml >> /tmp/kafka-jmx.yml &&
      exec java -jar jmx_prometheus_standalone.jar 5556 /tmp/kafka-jmx.yml
    depends_on:
      kafka-1:
        condition: service_started
    networks:
      - kafka-network

  jmx-exporter-kafka-2:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-kafka-2
    environment:
      JMX_HOSTPORT: "kafka-2:9999"
    volumes:
      - ./jmx-exporter/kafka-kraft-3_0_0-rules.yml:/etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      printf 'hostPort: %s\n\n' "$$JMX_HOSTPORT" > /tmp/kafka-jmx.yml &&
      cat /etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml >> /tmp/kafka-jmx.yml &&
      exec java -jar jmx_prometheus_standalone.jar 5556 /tmp/kafka-jmx.yml
    depends_on:
      kafka-2:
        condition: service_started
    networks:
      - kafka-network

  jmx-exporter-kafka-3:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-exporter-kafka-3
    environment:
      JMX_HOSTPORT: "kafka-3:9999"
    volumes:
      - ./jmx-exporter/kafka-kraft-3_0_0-rules.yml:/etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      printf 'hostPort: %s\n\n' "$$JMX_HOSTPORT" > /tmp/kafka-jmx.yml &&
      cat /etc/jmx-exporter/kafka-kraft-3_0_0-rules.yml >> /tmp/kafka-jmx.yml &&
      exec java -jar jmx_prometheus_standalone.jar 5556 /tmp/kafka-jmx.yml
    depends_on:
      kafka-3:
        condition: service_started
    networks:
      - kafka-network

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-topic-init
    env_file:
      - ../../config/.env
    environment:
      BOOTSTRAP_SERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      TOPIC_NAME: "taxi-event-data"
      TOPIC_PARTITIONS: "12"
      TOPIC_REPLICATION_FACTOR: "3"
      TOPIC_MIN_INSYNC_REPLICAS: "2"
      TOPIC_ENSURE_TIMEOUT_SEC: "600"
      TOPIC_ENSURE_RETRY_SEC: "5"
    volumes:
      - ./scripts/ensure_topic_shape.sh:/usr/local/bin/ensure_topic_shape.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/ensure_topic_shape.sh"]
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - kafka-network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - kafka-network
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

networks:
  kafka-network:
    name: kafka-network
    driver: bridge

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
