services:
  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-1
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_1_EXTERNAL_PORT:-9092}:9092"
      - "${KAFKA_1_INTERNAL_PORT:-29092}:29092"
      - "${KAFKA_1_CONTROLLER_PORT:-19093}:19093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${KAFKA_1_IP}:${KAFKA_1_CONTROLLER_PORT:-19093},2@${KAFKA_2_IP}:${KAFKA_2_CONTROLLER_PORT:-19094},3@${KAFKA_3_IP}:${KAFKA_3_CONTROLLER_PORT:-19095}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},INTERNAL://${KAFKA_1_IP}:${KAFKA_1_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka1-data:/var/lib/kafka/data
    networks:
      - kafka-network
    depends_on:
      - promtail-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-2
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_2_EXTERNAL_PORT:-9094}:9092"
      - "${KAFKA_2_INTERNAL_PORT:-29094}:29092"
      - "${KAFKA_2_CONTROLLER_PORT:-19094}:19093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${KAFKA_1_IP}:${KAFKA_1_CONTROLLER_PORT:-19093},2@${KAFKA_2_IP}:${KAFKA_2_CONTROLLER_PORT:-19094},3@${KAFKA_3_IP}:${KAFKA_3_CONTROLLER_PORT:-19095}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},INTERNAL://${KAFKA_2_IP}:${KAFKA_2_INTERNAL_PORT:-29094}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka2-data:/var/lib/kafka/data
    networks:
      - kafka-network
    depends_on:
      - promtail-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-3
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_3_EXTERNAL_PORT:-9096}:9092"
      - "${KAFKA_3_INTERNAL_PORT:-29096}:29092"
      - "${KAFKA_3_CONTROLLER_PORT:-19095}:19093"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${KAFKA_1_IP}:${KAFKA_1_CONTROLLER_PORT:-19093},2@${KAFKA_2_IP}:${KAFKA_2_CONTROLLER_PORT:-19094},3@${KAFKA_3_IP}:${KAFKA_3_CONTROLLER_PORT:-19095}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:19093"
      KAFKA_ADVERTISED_LISTENERS: "EXTERNAL://${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096},INTERNAL://${KAFKA_3_IP}:${KAFKA_3_INTERNAL_PORT:-29096}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_COMPRESSION_TYPE: "lz4"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka3-data:/var/lib/kafka/data
    networks:
      - kafka-network
    depends_on:
      - promtail-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
    env_file:
      - ../../config/.env
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "kafka-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}"
    networks:
      - kafka-network
    restart: unless-stopped


  promtail-1:
    image: grafana/promtail:3.3.2
    container_name: promtail-kafka-1
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network

  promtail-2:
    image: grafana/promtail:3.3.2
    container_name: promtail-kafka-2
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network


  promtail-3:
    image: grafana/promtail:3.3.2
    container_name: promtail-kafka-3
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
