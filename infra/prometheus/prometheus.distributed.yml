global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: "kafka-exporter"

  - job_name: "kafka-jmx"
    static_configs:
      - targets:
          - "${KAFKA_1_IP}:${KAFKA_1_JMX_EXPORTER_PORT:-9404}"
        labels:
          service: "kafka-jmx-1"
      - targets:
          - "${KAFKA_2_IP}:${KAFKA_2_JMX_EXPORTER_PORT:-9405}"
        labels:
          service: "kafka-jmx-2"
      - targets:
          - "${KAFKA_3_IP}:${KAFKA_3_JMX_EXPORTER_PORT:-9406}"
        labels:
          service: "kafka-jmx-3"

  - job_name: "ingestor"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "${INGESTOR_1_IP}:${INGESTOR_1_PORT}"
          - "${INGESTOR_2_IP}:${INGESTOR_2_PORT}"
          - "${INGESTOR_3_IP}:${INGESTOR_3_PORT}"
        labels:
          service: "ingestor"

  - job_name: "generator"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${GENERATOR_IP}:${GENERATOR_METRICS_PORT:-9108}"
        labels:
          service: "generator"

  - job_name: "nginx"
    static_configs:
      - targets:
          - "${NGINX_IP}:${NGINX_EXPORTER_PORT:-9113}"
        labels:
          service: "nginx-exporter"

  - job_name: "promtail-nginx"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${NGINX_IP}:${NGINX_PROMTAIL_PORT:-9085}"
        labels:
          service: "promtail-nginx"

  - job_name: "clickhouse"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${CLICKHOUSE_IP}:${CLICKHOUSE_PROMETHEUS_PORT:-9363}"
        labels:
          service: "clickhouse"

  - job_name: "flink"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${FLINK_IP}:${FLINK_JOBMANAGER_METRICS_PORT:-9249}"
        labels:
          service: "flink-jobmanager"
      - targets:
          - "${FLINK_TASKMANAGER_1_IP}:${FLINK_TASKMANAGER_1_METRICS_PORT:-9250}"
        labels:
          service: "flink-taskmanager-1"
      - targets:
          - "${FLINK_TASKMANAGER_2_IP}:${FLINK_TASKMANAGER_2_METRICS_PORT:-9251}"
        labels:
          service: "flink-taskmanager-2"
      - targets:
          - "${FLINK_TASKMANAGER_3_IP}:${FLINK_TASKMANAGER_3_METRICS_PORT:-9252}"
        labels:
          service: "flink-taskmanager-3"

  - job_name: "promtail-loki"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "${LOKI_IP}:${PROMTAIL_LOKI_PORT:-9084}"
        labels:
          service: "promtail-loki"

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://${CLICKHOUSE_IP}:${CLICKHOUSE_HTTP_PORT:-8123}/ping
          - http://${GRAFANA_IP}:${GRAFANA_PORT:-3000}/api/health
          - http://${LOKI_IP}:${LOKI_PORT:-3100}/ready
          - http://${FLINK_IP}:${FLINK_JOBMANAGER_PORT}/overview
          - http://${NGINX_IP}:${NGINX_LB_PORT}/health
          - http://${INGESTOR_1_IP}:${INGESTOR_1_PORT}
          - http://${INGESTOR_2_IP}:${INGESTOR_2_PORT}
          - http://${INGESTOR_3_IP}:${INGESTOR_3_PORT}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: ".*8123.*"
        target_label: service
        replacement: "ClickHouse"
      - source_labels: [__param_target]
        regex: ".*3000.*"
        target_label: service
        replacement: "Grafana"
      - source_labels: [__param_target]
        regex: ".*3100.*"
        target_label: service
        replacement: "Loki"
      - source_labels: [__param_target]
        regex: ".*${FLINK_JOBMANAGER_PORT}.*"
        target_label: service
        replacement: "Flink"
      - source_labels: [__param_target]
        regex: ".*${NGINX_LB_PORT}.*"
        target_label: service
        replacement: "Nginx LB"
      - source_labels: [__param_target]
        regex: ".*${INGESTOR_1_PORT}.*"
        target_label: service
        replacement: "Ingestor 1"
      - source_labels: [__param_target]
        regex: ".*${INGESTOR_2_PORT}.*"
        target_label: service
        replacement: "Ingestor 2"
      - source_labels: [__param_target]
        regex: ".*${INGESTOR_3_PORT}.*"
        target_label: service
        replacement: "Ingestor 3"

  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - ${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT}
        labels:
          service: "Kafka 1"
      - targets:
          - ${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT}
        labels:
          service: "Kafka 2"
      - targets:
          - ${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT}
        labels:
          service: "Kafka 3"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
