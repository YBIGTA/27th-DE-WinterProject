services:
  flink-jobmanager:
    build: ../../services/flink-job
    image: flink-taxi-job:latest
    container_name: flink-jobmanager
    command: standalone-job --job-classname com.example.TaxiRealtimeJob
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8081}:8081"
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 4
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}
      - FLINK_CLICKHOUSE_HOST=clickhouse
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
      - FLINK_PARALLELISM=4
      - FLINK_TASKMANAGER_SLOTS=4
      - FLINK_WATERMARK_OUT_OF_ORDERNESS_SEC=5
      - FLINK_WINDOW_DEMAND_MINUTES=3
      - FLINK_JDBC_BATCH_SIZE=20000
      - FLINK_JDBC_BATCH_INTERVAL_MS=1000
      - FLINK_KAFKA_TOPIC=taxi-event-data
      - FLINK_KAFKA_GROUP_ID=${FLINK_KAFKA_GROUP_ID:-taxi-realtime-flink}
      - FLINK_ENABLE_CLICKHOUSE_SINK=${FLINK_ENABLE_CLICKHOUSE_SINK:-true}
      - FLINK_CLICKHOUSE_DATABASE=default
      - FLINK_CLICKHOUSE_TABLE=taxi_events
    networks:
      - kafka-network

  flink:
    image: flink-taxi-job:latest
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=kafka-1:${KAFKA_INTERNAL_PORT:-29092},kafka-2:${KAFKA_INTERNAL_PORT:-29092},kafka-3:${KAFKA_INTERNAL_PORT:-29092}
      - FLINK_CLICKHOUSE_HOST=clickhouse
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
      - FLINK_PARALLELISM=4
      - FLINK_TASKMANAGER_SLOTS=4
      - FLINK_WATERMARK_OUT_OF_ORDERNESS_SEC=5
      - FLINK_WINDOW_DEMAND_MINUTES=3
      - FLINK_JDBC_BATCH_SIZE=20000
      - FLINK_JDBC_BATCH_INTERVAL_MS=1000
      - FLINK_KAFKA_TOPIC=taxi-event-data
      - FLINK_KAFKA_GROUP_ID=${FLINK_KAFKA_GROUP_ID:-taxi-realtime-flink}
      - FLINK_ENABLE_CLICKHOUSE_SINK=${FLINK_ENABLE_CLICKHOUSE_SINK:-true}
      - FLINK_CLICKHOUSE_DATABASE=default
      - FLINK_CLICKHOUSE_TABLE=taxi_events
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network
