services:
  # 1. Flink JobManager
  flink-jobmanager:
    build: ../../services/flink-job
    image: flink-taxi-job:latest
    container_name: flink-jobmanager
    command: standalone-job --job-classname com.example.TaxiRealtimeJob
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8084}:8081"
      - "${FLINK_JOBMANAGER_RPC_PORT:-6129}:${FLINK_JOBMANAGER_RPC_PORT:-6129}"
      - "${FLINK_JOBMANAGER_METRICS_PORT:-9249}:9249"
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: ${FLINK_IP}
        jobmanager.rpc.port: ${FLINK_JOBMANAGER_RPC_PORT:-6129}
        parallelism.default: 12
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}
      - FLINK_CLICKHOUSE_HOST=${CLICKHOUSE_IP}
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
      - FLINK_PARALLELISM=12
      - FLINK_WATERMARK_OUT_OF_ORDERNESS_SEC=5
      - FLINK_WINDOW_DEMAND_MINUTES=3
      - FLINK_JDBC_BATCH_SIZE=5000
      - FLINK_JDBC_BATCH_INTERVAL_MS=3000
      - FLINK_KAFKA_TOPIC=taxi-event-data
      - FLINK_KAFKA_GROUP_ID=${FLINK_KAFKA_GROUP_ID:-taxi-realtime-flink}
      - FLINK_KAFKA_START_OFFSETS=${FLINK_KAFKA_START_OFFSETS:-committed}
      - FLINK_ENABLE_CLICKHOUSE_SINK=${FLINK_ENABLE_CLICKHOUSE_SINK:-true}
      - FLINK_CLICKHOUSE_DATABASE=default
      - FLINK_CLICKHOUSE_TABLE=taxi_events
      - FLINK_ENABLE_PREDICTION_SINK=${FLINK_ENABLE_PREDICTION_SINK:-true}
      - FLINK_CLICKHOUSE_PREDICTION_TABLE=${FLINK_CLICKHOUSE_PREDICTION_TABLE:-taxi_predictions}
      - FLINK_ONNX_MODEL_PATH=${FLINK_ONNX_MODEL_PATH:-/opt/flink/model/taxi_demand_model.onnx}
      - FLINK_MODEL_VERSION=${FLINK_MODEL_VERSION:-onnx_v1}
      - FLINK_MODEL_FEATURE_LAG_STEPS=${FLINK_MODEL_FEATURE_LAG_STEPS:-20}
      - FLINK_MODEL_HORIZON_STEPS=${FLINK_MODEL_HORIZON_STEPS:-5}
      - FLINK_MODEL_INTERVAL_MINUTES=${FLINK_MODEL_INTERVAL_MINUTES:-3}
    volumes:
      - ../../model/models:/opt/flink/model:ro
      - ../../services/flink-job/data:/opt/flink/data
    networks:
      - kafka-network
    depends_on:
      - promtail

  # 2. Flink TaskManager
  flink-taskmanager-1:
    image: flink-taxi-job:latest
    container_name: flink-taskmanager-1
    command: taskmanager
    ports:
      - "${FLINK_TASKMANAGER_1_RPC_PORT:-6122}:${FLINK_TASKMANAGER_1_RPC_PORT:-6122}"
      - "${FLINK_TASKMANAGER_1_METRICS_PORT:-9250}:9249"
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: ${FLINK_IP}
        jobmanager.rpc.port: ${FLINK_JOBMANAGER_RPC_PORT:-6129}
        taskmanager.rpc.port: ${FLINK_TASKMANAGER_1_RPC_PORT:-6122}
        taskmanager.numberOfTaskSlots: 4
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}
      - FLINK_CLICKHOUSE_HOST=${CLICKHOUSE_IP}
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
    volumes:
      - ../../model/models:/opt/flink/model:ro
      - ../../services/flink-job/data:/opt/flink/data
    networks:
      - kafka-network
    depends_on:
      - promtail

  # 3. Flink TaskManager 2
  flink-taskmanager-2:
    image: flink-taxi-job:latest
    container_name: flink-taskmanager-2
    command: taskmanager
    ports:
      - "${FLINK_TASKMANAGER_2_RPC_PORT:-6123}:${FLINK_TASKMANAGER_2_RPC_PORT:-6123}"
      - "${FLINK_TASKMANAGER_2_METRICS_PORT:-9251}:9249"
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: ${FLINK_IP}
        jobmanager.rpc.port: ${FLINK_JOBMANAGER_RPC_PORT:-6129}
        taskmanager.rpc.port: ${FLINK_TASKMANAGER_2_RPC_PORT:-6123}
        taskmanager.numberOfTaskSlots: 4
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}
      - FLINK_CLICKHOUSE_HOST=${CLICKHOUSE_IP}
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
    volumes:
      - ../../model/models:/opt/flink/model:ro
      - ../../services/flink-job/data:/opt/flink/data
    networks:
      - kafka-network
    depends_on:
      - promtail

  # 4. Flink TaskManager 3
  flink-taskmanager-3:
    image: flink-taxi-job:latest
    container_name: flink-taskmanager-3
    command: taskmanager
    ports:
      - "${FLINK_TASKMANAGER_3_RPC_PORT:-6124}:${FLINK_TASKMANAGER_3_RPC_PORT:-6124}"
      - "${FLINK_TASKMANAGER_3_METRICS_PORT:-9252}:9249"
    env_file:
      - ../../config/.env
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: ${FLINK_IP}
        jobmanager.rpc.port: ${FLINK_JOBMANAGER_RPC_PORT:-6129}
        taskmanager.rpc.port: ${FLINK_TASKMANAGER_3_RPC_PORT:-6124}
        taskmanager.numberOfTaskSlots: 4
        metrics.reporters: prom
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
      - FLINK_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}
      - FLINK_CLICKHOUSE_HOST=${CLICKHOUSE_IP}
      - FLINK_CLICKHOUSE_PORT=${CLICKHOUSE_HTTP_PORT:-8123}
    volumes:
      - ../../model/models:/opt/flink/model:ro
      - ../../services/flink-job/data:/opt/flink/data
    networks:
      - kafka-network
    depends_on:
      - promtail
    restart: unless-stopped


  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail-flink
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network
networks:
  kafka-network:
    external: true
    name: kafka-network
