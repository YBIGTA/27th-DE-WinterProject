services:
  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    env_file:
      - ../../config/.env
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kafka-network

  # Promtail은 각 머신에서 로컬 Docker 모니터링만 담당
  # 중앙 Loki로 로그 전송
  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    privileged: true
    env_file:
      - ../../config/.env
    environment:
      LOKI_URL: "${LOKI_URL:-http://loki:3100}"
    volumes:
      - ./promtail-config.distributed.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network

volumes:
  loki-data:
