services:
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    env_file:
      - ../../config/.env
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - /tmp/loki:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kafka-network

  # Promtail은 각 머신에서 로컬 Docker 모니터링만 담당
  # 중앙 Loki로 로그 전송
  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.distributed.yml:/etc/promtail/config.yml.template:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - sh
      - -c
      - |
        # LOKI_URL 환경변수로 중앙 Loki 지정 (각 머신의 .env에서 설정 필요)
        LOKI_URL=$${LOKI_URL:-http://100.115.77.80:3100}
        envsubst < /etc/promtail/config.yml.template > /etc/promtail/config.yml
        exec /usr/bin/promtail -config.file=/etc/promtail/config.yml
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network
