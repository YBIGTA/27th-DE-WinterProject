services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - ../../config/.env
    environment:
      TZ: "Asia/Seoul"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123" # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native TCP interface
      - "${CLICKHOUSE_PROMETHEUS_PORT:-9363}:9363" # Prometheus metrics
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./config.xml:/etc/clickhouse-server/config.d/zz-custom.xml:ro
      - ./users.xml:/etc/clickhouse-server/users.d/zz-custom-users.xml:ro
      
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "bash", "-lc", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  clickhouse-schema-sync:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse-schema-sync
    restart: "no"
    env_file:
      - ../../config/.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      SCHEMA_FILE: /schema.sql
      CLICKHOUSE_SCHEMA_BACKFILL: "${CLICKHOUSE_SCHEMA_BACKFILL:-false}"
    volumes:
      - ./schema.sql:/schema.sql:ro
      - ./scripts/apply_schema.sh:/usr/local/bin/apply_schema.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/apply_schema.sh"]
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - kafka-network

networks:
  kafka-network:
    external: true
    name: kafka-network

volumes:
  clickhouse_data:
