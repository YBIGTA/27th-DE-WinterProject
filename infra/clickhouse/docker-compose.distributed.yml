services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    restart: unless-stopped
    env_file:
      - ../../config/.env
    environment:
      TZ: "Asia/Seoul"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123" # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000" # Native TCP interface
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "bash", "-lc", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12


  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail-clickhouse
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    depends_on:
      - clickhouse
    networks:
      - kafka-network
networks:
  kafka-network:
    external: true
    name: kafka-network

volumes:
  clickhouse_data:
