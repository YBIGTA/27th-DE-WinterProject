version: '3.8'

services:
  ingestor-1:
    build: .
    container_name: ingestor-1
    env_file:
      - ../config/.env
    ports:
      - "${INGESTOR_1_PORT:-8081}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka_kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-2:
    build: .
    container_name: ingestor-2
    env_file:
      - ../config/.env
    ports:
      - "${INGESTOR_2_PORT:-8082}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka_kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-3:
    build: .
    container_name: ingestor-3
    env_file:
      - ../config/.env
    ports:
      - "${INGESTOR_3_PORT:-8083}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka_kafka-network
    depends_on:
      - kafka-healthcheck
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nginx load balancer for the 3 ingestors
  nginx-lb:
    image: nginx:alpine
    container_name: ingestor-lb
    env_file:
      - ../config/.env
    ports:
      - "${NGINX_LB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - kafka_kafka-network
    depends_on:
      - ingestor-1
      - ingestor-2
      - ingestor-3
    restart: unless-stopped

  # Dummy service to check kafka is healthy
  kafka-healthcheck:
    image: busybox
    container_name: kafka-healthcheck
    command: ["sh", "-c", "echo 'Waiting for Kafka...' && sleep 5"]
    networks:
      - kafka_kafka-network

networks:
  kafka_kafka-network:
    external: true
