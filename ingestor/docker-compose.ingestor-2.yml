version: '3.8'

services:
  ingestor-2:
    build: .
    container_name: ingestor-2
    env_file:
      - ../config/.env
    ports:
      - "${INGESTOR_2_PORT:-8080}:${INGESTOR_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
