version: '3.8'

services:
  ingestor-1:
    build: .
    container_name: ingestor-1
    env_file:
      - ../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:9092,${KAFKA_2_IP}:9092,${KAFKA_3_IP}:9092"
      APP_KAFKA_TOPIC: "${APP_KAFKA_TOPIC}"
    ports:
      - "${INGESTOR_1_PORT:-8080}:${INGESTOR_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
