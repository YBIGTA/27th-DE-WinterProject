apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: taxi-pipeline
  labels:
    app: ingestor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z kafka-0.kafka-headless.taxi-pipeline.svc.cluster.local 29092 && \
                    nc -z kafka-1.kafka-headless.taxi-pipeline.svc.cluster.local 29092; do
                echo "Waiting for at least two Kafka brokers..."
                sleep 3
              done
      containers:
        - name: ingestor
          image: k3d-taxi-registry:5000/taxi-ingestor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ingestor-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
