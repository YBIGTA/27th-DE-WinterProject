apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: taxi-pipeline
  labels:
    app: flink
    component: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z kafka-0.kafka-headless.taxi-pipeline.svc.cluster.local 29092; do
                echo "Waiting for Kafka broker..."
                sleep 3
              done
        - name: create-kafka-topic
          image: confluentinc/cp-kafka:7.5.0
          command:
            - sh
            - -c
            - |
              kafka-topics --create --if-not-exists \
                --topic taxi-event-data \
                --bootstrap-server kafka-0.kafka-headless.taxi-pipeline.svc.cluster.local:29092
              echo "Topic taxi-event-data ensured."
      containers:
        - name: flink-jobmanager
          image: k3d-taxi-registry:5000/taxi-flink-job:latest
          imagePullPolicy: Always
          args:
            - standalone-job
            - --job-classname
            - com.example.TaxiRealtimeJob
          envFrom:
            - configMapRef:
                name: flink-config
          ports:
            - name: rest
              containerPort: 8081
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
          readinessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
