apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: taxi-pipeline
  labels:
    app: flink
    component: jobmanager
spec:
  type: ClusterIP
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: rpc
    - name: blob
      port: 6124
      targetPort: blob
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager-ui
  namespace: taxi-pipeline
  labels:
    app: flink
    component: jobmanager-ui
spec:
  type: NodePort
  selector:
    app: flink
    component: jobmanager
  ports:
    - name: rest
      port: 8081
      targetPort: rest
      nodePort: 30081
