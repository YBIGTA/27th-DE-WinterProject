services:
  ingestor-1:
    build: .
    container_name: ingestor-1
    env_file:
      - ../../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
      APP_KAFKA_TOPIC: "taxi-event-data"
      APP_TUNING_BUFFER_SIZE: 100000
      APP_TUNING_BATCH_SIZE: 1000
      APP_TUNING_BATCH_TIMEOUT_MS: 10
      APP_TUNING_KAFKA_SEND_CONCURRENCY: 12
      APP_TUNING_METRICS_INTERVAL_SEC: 10
    ports:
      - "${INGESTOR_1_PORT:-8081}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka-network
    depends_on:
      - promtail-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-2:
    build: .
    container_name: ingestor-2
    env_file:
      - ../../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
      APP_KAFKA_TOPIC: "taxi-event-data"
      APP_TUNING_BUFFER_SIZE: 100000
      APP_TUNING_BATCH_SIZE: 1000
      APP_TUNING_BATCH_TIMEOUT_MS: 10
      APP_TUNING_KAFKA_SEND_CONCURRENCY: 12
      APP_TUNING_METRICS_INTERVAL_SEC: 10
    ports:
      - "${INGESTOR_2_PORT:-8082}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka-network
    depends_on:
      - promtail-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ingestor-3:
    build: .
    container_name: ingestor-3
    env_file:
      - ../../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
      APP_KAFKA_TOPIC: "taxi-event-data"
      APP_TUNING_BUFFER_SIZE: 100000
      APP_TUNING_BATCH_SIZE: 1000
      APP_TUNING_BATCH_TIMEOUT_MS: 10
      APP_TUNING_KAFKA_SEND_CONCURRENCY: 12
      APP_TUNING_METRICS_INTERVAL_SEC: 10
    ports:
      - "${INGESTOR_3_PORT:-8083}:${INGESTOR_PORT:-8080}"
    networks:
      - kafka-network
    depends_on:
      - promtail-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  promtail-1:
    image: grafana/promtail:3.3.2
    container_name: promtail-ingestor-1
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network
    restart: unless-stopped

  promtail-2:
    image: grafana/promtail:3.3.2
    container_name: promtail-ingestor-2
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network
    restart: unless-stopped

  promtail-3:
    image: grafana/promtail:3.3.2
    container_name: promtail-ingestor-3
    privileged: true
    env_file:
      - ../../config/.env
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker:/var/lib/docker:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - kafka-network
    restart: unless-stopped

networks:
  kafka-network:
    external: true
    name: kafka-network