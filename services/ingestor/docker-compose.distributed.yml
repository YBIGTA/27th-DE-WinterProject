services:
  ingestor-1:
    build: .
    container_name: ingestor-1
    env_file:
      - ../../config/.env
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_1_IP}:${KAFKA_1_EXTERNAL_PORT:-9092},${KAFKA_2_IP}:${KAFKA_2_EXTERNAL_PORT:-9094},${KAFKA_3_IP}:${KAFKA_3_EXTERNAL_PORT:-9096}"
      SERVER_PORT: "${INGESTOR_PORT:-8080}"
      APP_KAFKA_TOPIC: "taxi-event-data"
      APP_TUNING_BUFFER_SIZE: 30000
      APP_TUNING_BATCH_SIZE: 500
      APP_TUNING_BATCH_TIMEOUT_MS: 10
      APP_TUNING_KAFKA_SEND_CONCURRENCY: 4
      APP_TUNING_METRICS_INTERVAL_SEC: 10
    ports:
      - "${INGESTOR_1_PORT:-8081}:${INGESTOR_PORT:-8080}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${INGESTOR_PORT:-8080}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

